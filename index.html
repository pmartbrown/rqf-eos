<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Quick Funds — EOS Foundation | May 25, 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #f1f4f9;
      --surface:      #ffffff;
      --surface-2:    #f7f9fd;
      --border:       #e3e9f4;
      --border-mid:   #c8d3e8;
      --text:         #0c1422;
      --text-2:       #2d3f55;
      --muted:        #607590;
      --faint:        #96a8bf;
      --accent:       #b8900a;
      --accent-light: #fef3c7;
      --accent-mid:   rgba(184,144,10,0.15);
      --accent-dark:  #8a6b08;
      --green:        #0a8f63;
      --green-bg:     #eafaf4;
      --green-border: #6dd4b0;
      --amber:        #c97008;
      --amber-bg:     #fff8eb;
      --amber-border: #f0c050;
      --red:          #c82020;
      --red-bg:       #fef1f1;
      --red-border:   #f0a0a0;
      --blue:         #1d57d8;
      --blue-bg:      #eef3ff;
      --blue-border:  #8bb0f4;
      --shadow-xs:    0 1px 2px rgba(12,20,34,0.04);
      --shadow-sm:    0 1px 3px rgba(12,20,34,0.07), 0 1px 2px rgba(12,20,34,0.04);
      --shadow:       0 2px 8px rgba(12,20,34,0.07), 0 1px 3px rgba(12,20,34,0.04);
      --shadow-md:    0 6px 18px rgba(12,20,34,0.09), 0 2px 6px rgba(12,20,34,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── ACCENT BAR ──────────────────────────── */
    .header-bar {
      height: 5px;
      background: linear-gradient(90deg, #7a5c00 0%, #c9a012 35%, #e8c040 60%, #c9a012 80%, #7a5c00 100%);
    }

    /* ── HEADER ─────────────────────────────── */
    header {
      background: linear-gradient(160deg, #f0f5ff 0%, #fafcff 45%, #ffffff 100%);
      border-bottom: 1px solid var(--border);
      padding: 56px 48px 48px;
      text-align: center;
      position: relative;
    }
    .eyebrow {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }
    header h1 em { color: var(--accent); font-style: normal; }
    .subtitle {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.3px;
      margin-top: 6px;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 5px 13px 5px 10px;
      border-radius: 100px;
      border: 1px solid;
      display: flex;
      align-items: center;
      gap: 7px;
      letter-spacing: 0.1px;
    }
    .b-green  { color: var(--green);  border-color: var(--green-border);  background: var(--green-bg); }
    .b-amber  { color: var(--amber);  border-color: var(--amber-border);  background: var(--amber-bg); }
    .b-muted  { color: var(--muted);  border-color: var(--border-mid);    background: var(--surface-2); }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .b-green .badge-dot  { background: var(--green); }
    .b-amber .badge-dot  { background: var(--amber); }
    .b-muted .badge-dot  { background: var(--faint); }

    /* ── NAV ─────────────────────────────────── */
    nav {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(12,20,34,0.04);
      overflow-x: auto;
    }
    nav ul { display: flex; list-style: none; justify-content: center; padding: 0 16px; gap: 2px; min-width: max-content; margin: 0 auto; }
    nav a {
      display: block;
      padding: 13px 14px;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      text-decoration: none;
      color: var(--muted);
      position: relative;
      transition: color .18s;
      white-space: nowrap;
    }
    nav a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 14px; right: 14px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform .18s;
    }
    nav a:hover { color: var(--accent); }
    nav a:hover::after { transform: scaleX(1); }

    /* ── LAYOUT ──────────────────────────────── */
    main { max-width: 1060px; margin: 0 auto; padding: 72px 40px 96px; }
    section { margin-bottom: 84px; }

    .sec-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .sec-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      border: 1px solid rgba(184,144,10,0.22);
      border-radius: 5px;
      padding: 2px 8px;
      flex-shrink: 0;
    }
    .sec-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border) 0%, transparent 100%);
    }
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.4px;
      margin-bottom: 8px;
 2  }
    .sec-desc {
      font-size: 13.5px;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    /* ── DRAFT BANNER ────────────────────────── */
    .draft-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 28px;
      font-size: 12.5px;
      color: var(--amber);
    }
    .draft-banner strong { font-weight: 600; }
    .draft-icon { font-size: 15px; flex-shrink: 0; }

    /* ── CORE VALUES ─────────────────────────── */
    .value-list { display: flex; flex-direction: column; border-top: 1px solid var(--border); }

    .value-row {
      display: grid;
      grid-template-columns: 48px 196px 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
      padding: 30px 0;
      transition: background .15s;
    }
    .value-row:hover { background: rgba(184,144,10,0.025); }

    .val-num {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      opacity: .16;
      padding-top: 2px;
    }
    .val-left {
      padding-right: 28px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
    }
    .val-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .firing-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid var(--red-border);
      border-radius: 4px;
      padding: 3px 8px;
      width: fit-content;
    }
    .val-right {
      padding-left: 32px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .val-body {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.72;
    }
    .val-note {
      font-size: 12.5px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.65;
    }

    /* ── CORE FOCUS ──────────────────────────── */
    .focus-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }

    .focus-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 0 0 12px 12px;
      padding: 28px 30px;
      box-shadow: var(--shadow);
    }
    .focus-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .focus-quote {
      font-size: 1.02rem;
      color: var(--text);
      line-height: 1.72;
      font-style: italic;
    }

    .bridge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 40px;
      box-shadow: var(--shadow);
    }
    .bridge-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--faint);
      text-align: center;
      margin-bottom: 32px;
    }
    .bridge-row {
      display: grid;
      grid-template-columns: 1fr 160px 1fr;
      gap: 0;
      align-items: center;
    }
    .bridge-side {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px 24px;
    }
    .bridge-side-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .bridge-side-val {
      font-size: .95rem;
      font-weight: 700;
      color: var(--accent-dark);
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }
    .bridge-side-sub { font-size: 12.5px; color: var(--text-2); line-height: 1.6; }
    .bridge-mid { text-align: center; padding: 0 16px; }
    .bridge-mid-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .bridge-arrows { font-size: 22px; color: var(--accent); opacity: .45; letter-spacing: 6px; margin-bottom: 6px; }
    .bridge-mid-sub { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .bridge-footnote {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
      font-style: italic;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* ── 10-YEAR TARGET ──────────────────────── */
    .target-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .target-opt {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 24px 22px;
      cursor: default;
      transition: border-color .18s, box-shadow .18s;
    }
    .target-opt.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .target-opt-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 10px;
    }
    .target-opt.active .target-opt-label { color: var(--accent); }
    .target-opt-text {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.7;
      font-style: italic;
    }
    .target-opt.active .target-opt-text { color: var(--text); font-weight: 500; }
    .target-working {
      background: var(--accent-light);
      border: 1px solid rgba(184,144,10,0.3);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      color: var(--accent-dark);
      margin-top: 8px;
    }
    .target-working strong { font-weight: 600; }

    /* ── MARKETING STRATEGY ──────────────────── */
    .mkt-parts { display: flex; flex-direction: column; gap: 28px; }
    .mkt-part {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }
    .mkt-head {
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mkt-head-n {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      opacity: .22;
      line-height: 1;
    }
    .mkt-head-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
    }
    .mkt-body { padding: 24px 28px; }
    .mkt-body p { font-size: 14px; color: var(--text-2); line-height: 1.72; }

    .uniques-list { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    .unique-item {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .unique-n {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 1px solid rgba(184,144,10,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-dark);
      flex-shrink: 0;
      margin-top: 1px;
    }
    .unique-content { flex: 1; }
    .unique-title { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .unique-body { font-size: 13.5px; color: var(--text-2); line-height: 1.65; }

    .process-steps { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
    .process-step {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .process-step:last-child { border-bottom: none; }
    .ps-n {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }
    .ps-content { flex: 1; }
    .ps-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .ps-desc { font-size: 13px; color: var(--text-2); line-height: 1.6; }

    .guar-card {
      background: linear-gradient(135deg, rgba(184,144,10,0.07) 0%, rgba(184,144,10,0.02) 100%);
      border: 1px solid rgba(184,144,10,0.22);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 22px 24px;
      font-size: 1.02rem;
      font-style: italic;
      color: var(--text);
      line-height: 1.72;
    }

    /* ── 3-YEAR PICTURE ──────────────────────── */
    .picture-metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .pic-metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 0 0 10px 10px;
      padding: 18px 18px;
      box-shadow: var(--shadow-xs);
    }
    .pic-metric-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 8px;
    }
    .pic-metric-val {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .pic-metric-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }

    .picture-story {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      box-shadow: var(--shadow-xs);
    }
    .picture-story-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 14px;
    }
    .picture-story p {
      font-size: 14px;
      color: var(--text-2);
      line-height: 1.8;
    }

    /* ── 1-YEAR PLAN ─────────────────────────── */
    .plan-layout { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
    .plan-metrics {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .plan-metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      box-shadow: var(--shadow-xs);
    }
    .plan-metric-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 6px;
    }
    .plan-metric-val {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-dark);
    }
    .plan-metric-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    .plan-goals-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: var(--shadow-xs);
    }
    .plan-goals-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .plan-goal {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .plan-goal:last-child { border-bottom: none; }
    .plan-goal-n {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      opacity: .22;
      line-height: 1;
      flex-shrink: 0;
      min-width: 22px;
      padding-top: 2px;
    }
    .plan-goal-content { flex: 1; }
    .plan-goal-title { font-size: 14.5px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .plan-goal-body { font-size: 13px; color: var(--text-2); line-height: 1.6; }

    /* ── Q3 ROCKS ────────────────────────────── */
    .rocks-list { display: flex; flex-direction: column; gap: 10px; }
    .rock-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr 140px 120px;
      gap: 20px;
      align-items: center;
      box-shadow: var(--shadow-xs);
      transition: box-shadow .15s;
    }
    .rock-item:hover { box-shadow: var(--shadow); }
    .rock-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
    }
    .rock-owner {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .rock-owner-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
    }
    .rock-status {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
      border: 1px solid;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .rs-pending { color: var(--muted); border-color: var(--border-mid); background: var(--surface-2); }
    .rs-progress { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
    .rs-done { color: var(--green); border-color: var(--green-border); background: var(--green-bg); }

    .rocks-header {
      display: grid;
      grid-template-columns: 1fr 140px 120px;
      gap: 20px;
      padding: 0 22px 10px;
    }
    .rocks-header span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ── ACCOUNTABILITY CHART ────────────────── */
    .ac-leadership {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .ac-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .ac-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: linear-gradient(135deg, rgba(184,144,10,0.08) 0%, rgba(184,144,10,0.03) 100%);
      border-bottom: 1px solid var(--border);
    }
    .ac-card-title {
      font-size: 11.5px;
  2   font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent-dark);
    }
    .ac-card-person {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .ac-card-body { padding: 18px 20px; }
    .ac-list { list-style: none; }
    .ac-list li {
      font-size: 13.5px;
      color: var(--text-2);
      padding: 4px 0 4px 16px;
      position: relative;
      line-height: 1.55;
    }
    .ac-list li::before {
      content: '›';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 700;
    }
    .ac-note {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      margin-top: 14px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-radius: 6px;
      border-left: 3px solid var(--border-mid);
      line-height: 1.55;
    }

    /* Org chart grouping for function cards */
    .ac-fn-groups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .ac-fn-group {}
    .ac-fn-group-hdr {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 8px;
      padding: 0 2px;
    }
    .ac-fn-group-hdr em {
      font-style: normal;
      color: var(--accent);
    }
    .ac-fn-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .ac-functions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .ac-fn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-xs);
    }
    .ac-fn-head {
      padding: 12px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .ac-fn-title {
      font-size: 11px;
      font-weight: 700;
      f     letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text);
    }
    .ac-fn-owner {
      font-size: 10.5px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }
    .ac-fn-body { padding: 14px 16px; }
    .ac-sub { margin-bottom: 13px; padding-bottom: 13px; border-bottom: 1px solid var(--border); }
    .ac-sub:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .ac-sub-name {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }
    .ac-sub-who { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .ac-sub-flag {
      font-size: 11px;
      font-weight: 500;
      color: var(--amber);
      margin-top: 3px;
    }
    .ac-sub-lock {
      font-size: 11px;
      font-weight: 500;
      color: var(--red);
      margin-top: 3px;
    }

    /* ── ISSUES ──────────────────────────────── */

    .issue {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid;
      border-radius: 0 10px 10px 0;
      padding: 20px 24px 20px 20px;
      box-shadow: var(--shadow-xs);
      display: flex;
   2  gap: 18px;
      align-items: flex-start;
    }
    .issue.p-high { border-left-color: var(--red); }
    .issue.p-med  { border-left-color: var(--amber); }
    .issue.p-low  { border-left-color: var(--blue); }
    .issue-n {
      font-size: 12px;
      font-weight: 700;
      color: var(--faint);
      min-width: 20px;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .issue-content { flex: 1; }
    .issue-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
      letter-spacing: -0.2px;
      line-height: 1.4;
    }
    .issue-body { font-size: 13.5px; color: var(--text-2); line-height: 1.65; }
    .issue-path {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      line-height: 1.6;
    }

    /* ── SCORECARD EMBED ─────────────────────── */
    .sc-embed {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .sc-live-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 20px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .sc-live-left { display: flex; align-items: center; }
    .sc-live-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
      animation: sc-pulse 2.4s ease-in-out infinite;
    }
    @keyframes sc-pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .sc-week-label { font-size: 13.5px; font-weight: 600; color: var(--text); }
    .sc-live-right { display: flex; align-items: center; gap: 16px; }
    .sc-tally { font-size: 12.5px; color: var(--muted); }
    .sc-full-link {
      font-size: 12.5px; font-weight: 600;
      color: var(--blue); text-decoration: none;
    }
    .sc-full-link:hover { text-decoration: underline; }
    .sc-loading { padding: 36px; text-align: center; color: var(--muted); font-size: 13.5px; }

    .sc-table-wrap { overflow-x: auto; }

    .sc-table th {
      padding: 10px 16px;
      text-align: left;
      font-size: 10.5px; font-weight: 700;
      letter-spacing: .8px; text-transform: uppercase;
      color: var(--muted);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .sc-table td { padding: 10px 16px; border-bottom: 1px solid var(--border); }
    .sc-table tbody tr:last-child td { border-bottom: none; }
    .sc-table tbody tr:hover { background: rgba(29,87,216,0.03); }
    .sc-metric-name { font-weight: 500; color: var(--text); }
    .sc-owner {
      font-size: 11px; font-weight: 600;
      color: var(--muted); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 100px;
      padding: 2px 8px; white-space: nowrap;
    }
    .sc-target { color: var(--muted); font-size: 13px; }
    .sc-val-green { color: var(--green); font-weight: 700; }
    .sc-val-red   { color: var(--red);   font-weight: 700; }
    .sc-val-neutral { color: var(--text-2); }
    .sc-avg-green { color: var(--green); }
    .sc-avg-red   { color: var(--red); }
